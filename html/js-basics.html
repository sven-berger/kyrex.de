<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Basics | DevKarriere</title>
    <link rel="stylesheet" href="style/js-basics.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <h1>"Hello World!"-Button</h1>
        <button class="button" onclick="helloWorld()">Hello World!</button>
      </div>

      <div class="container">
        <h1>Counter</h1>
        <div class="counterContainer">
          <div id="counterValue" class="counterValue">0</div>
          <button class="button" id="increase">Counter erhöhen</button>
          <button class="button" id="decrease">Counter verringern</button>
          <button class="button" id="reset">Counter zurücksetzen</button>
        </div>
      </div>

      <div class="container">
        <button class="button" id="popUpButton">Hello World!</button>
      </div>
    </main>

    <script src="/js/js-basics.js"></script>
  </body>
</html>
